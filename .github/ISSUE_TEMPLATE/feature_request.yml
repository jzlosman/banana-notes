name: Feature request
description: Suggest a feature or improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Describe the problem or use case. Keep personal note content and sensitive information out of the report.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is difficult or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change you would find useful.
    validations:
      required: true
