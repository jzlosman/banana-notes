name: Bug report
description: Report a reproducible problem with Banana Notes.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please check existing issues first. Do not include personal note content or other sensitive information.
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.3
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version (About panel)
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Release DMG
        - Homebrew
        - Source build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions that reproduce the problem.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal note content from this report
          required: true
