name: Feature request
description: Suggest an improvement to Banana Notes.
title: "Feature request"
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or need behind your request.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like to happen?
      description: Describe a solution or behavior you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any other approaches you have considered.
