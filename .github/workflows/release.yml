name: Signed Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test note behavior and web adapters
        run: npm test
      - name: Build web assets
        run: npm run build:web
      - name: Test native adapters
        run: bash scripts/native-tests.sh
      - name: Resolve release version
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$package_version" ]]; then
              echo "Tag version '$version' must match package.json version '$package_version'." >&2
              exit 1
            fi
          else
            version="$package_version"
          fi
          printf 'BANANA_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'BANANA_BUILD=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Require Sparkle public key for tagged releases
        if: github.event_name == 'push'
        run: |
          if [[ -z "$SPARKLE_PUBLIC_KEY" ]]; then
            echo 'SPARKLE_PUBLIC_KEY repository variable is required for tagged releases.' >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        id: keychain
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/banana-release-${GITHUB_RUN_ID}.keychain-db"
          echo "path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Developer ID signing secrets are incomplete.' >&2
            exit 1
          fi
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$SIGN_IDENTITY" || "$SIGN_IDENTITY" != *"($APPLE_TEAM_ID)"* ]]; then
            echo 'The imported keychain has no Developer ID Application identity for APPLE_TEAM_ID.' >&2
            exit 1
          fi
          printf 'SIGN_IDENTITY=%s\n' "$SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build universal app
        run: npm run build
      - name: Package and notarize
        if: github.event_name == 'push'
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_STORE_CONNECT_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER" ]]; then
            echo 'App Store Connect notarization secrets are incomplete.' >&2
            exit 1
          fi
          printf '%s' "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          bash scripts/package-release.sh
      - name: Sign Sparkle archive and generate appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'SPARKLE_PRIVATE_KEY repository secret is required for tagged releases.' >&2
            exit 1
          fi
          SPARKLE_DIR="$(bash scripts/fetch-sparkle.sh)"
          RELEASE_DIR="$GITHUB_WORKSPACE/build/release"
          ZIP="$RELEASE_DIR/Banana-Notes-${BANANA_VERSION}.zip"
          APPCAST_DIR="$RUNNER_TEMP/banana-appcast"
          mkdir -p "$APPCAST_DIR"
          cp "$ZIP" "$APPCAST_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DIR/bin/sign_update" --ed-key-file - "$ZIP" > "$RUNNER_TEMP/sparkle-signature.txt"
          if [[ ! -s "$RUNNER_TEMP/sparkle-signature.txt" ]]; then
            echo 'Sparkle did not produce an update signature.' >&2
            exit 1
          fi
          DOWNLOAD_PREFIX="https://github.com/jzlosman/banana-notes/releases/download/${GITHUB_REF_NAME}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_DIR/bin/generate_appcast" \
            --ed-key-file - --download-url-prefix "$DOWNLOAD_PREFIX" "$APPCAST_DIR"
          cp "$APPCAST_DIR/appcast.xml" "$RELEASE_DIR/appcast.xml"
          (
            cd "$RELEASE_DIR"
            shasum -a 256 "Banana-Notes-${BANANA_VERSION}.dmg" \
              "Banana-Notes-${BANANA_VERSION}.zip" appcast.xml > SHA256SUMS
          )
      - name: Upload release assets for draft creation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: banana-notes-release-assets
          path: build/release
          if-no-files-found: error
      - name: Remove temporary credentials
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.path }}
        run: |
          set +e
          if [[ -n "$KEYCHAIN_PATH" ]]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sparkle-signature.txt"

  publish-draft:
    name: Create draft GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: banana-notes-release-assets
          path: build/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BANANA_VERSION: ${{ github.ref_name }}
        run: |
          version="${BANANA_VERSION#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Banana Notes $version" \
            --notes "Signed, notarized universal macOS release. Review the attached assets and checksums before publishing." \
            "build/release/Banana-Notes-${version}.dmg" \
            "build/release/Banana-Notes-${version}.zip" \
            build/release/appcast.xml \
            build/release/SHA256SUMS
