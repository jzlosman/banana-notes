name: Banana Viewer Release

on:
  push:
    tags: ['viewer-v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Banana Viewer
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test notes and viewer behavior
        run: npm test
      - name: Build web assets
        run: npm run build:web
      - name: Test native adapters and generated branding
        run: |
          bash scripts/native-tests.sh
          npm run test:viewer:native
      - name: Resolve viewer release version
        run: |
          set -euo pipefail
          source_version="$(tr -d '\r\n' < viewer/version.txt)"
          if [[ ! "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "viewer/version.txt contains an invalid release version: '$source_version'." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag_version="${GITHUB_REF_NAME#viewer-v}"
            if [[ "$tag_version" != "$source_version" ]]; then
              echo "Viewer tag version '$tag_version' must match viewer/version.txt version '$source_version'." >&2
              exit 1
            fi
          fi
          printf 'VIEWER_VERSION=%s\n' "$source_version" >> "$GITHUB_ENV"
          printf 'VIEWER_BUILD=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        id: signing
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/banana-viewer-release-${GITHUB_RUN_ID}.keychain-db"
          echo "path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Developer ID signing secrets are incomplete.' >&2
            exit 1
          fi
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$SIGN_IDENTITY" || "$SIGN_IDENTITY" != *"($APPLE_TEAM_ID)"* ]]; then
            echo 'The imported keychain has no Developer ID Application identity for APPLE_TEAM_ID.' >&2
            exit 1
          fi
          printf 'SIGN_IDENTITY=%s\n' "$SIGN_IDENTITY" >> "$GITHUB_ENV"
          printf 'identity=%s\n' "$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build universal viewer app
        env:
          VIEWER_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: bash scripts/build-viewer.sh
      - name: Package and notarize viewer
        if: github.event_name == 'push'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_STORE_CONNECT_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER" ]]; then
            echo 'App Store Connect notarization secrets are incomplete.' >&2
            exit 1
          fi
          printf '%s' "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          bash scripts/package-release.sh viewer
      - name: Upload viewer release assets for draft creation
        if: github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: banana-viewer-release-assets
          path: build/viewer-release
          if-no-files-found: error
          overwrite: true
      - name: Remove temporary credentials
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.path }}
        run: |
          set +e
          if [[ -n "$KEYCHAIN_PATH" ]]; then security delete-keychain "$KEYCHAIN_PATH"; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"

  publish-draft:
    name: Create draft Banana Viewer release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download viewer release assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: banana-viewer-release-assets
          path: build/viewer-release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#viewer-v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --latest=false \
            --title "Banana Viewer $version" \
            --notes "Signed, notarized universal macOS release. Review the attached assets and checksums before publishing." \
            "build/viewer-release/Banana-Viewer-${version}.dmg" \
            "build/viewer-release/Banana-Viewer-${version}.zip" \
            build/viewer-release/SHA256SUMS
