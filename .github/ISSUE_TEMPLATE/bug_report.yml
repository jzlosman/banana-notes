name: Bug report
description: Report a problem with Banana Notes.
title: "Bug report"
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
      placeholder: What did you see?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the problem.
      placeholder: |
        1. Open…
        2. Choose…
        3. See…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Include the version shown in About Banana Notes.
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: app-build
    attributes:
      label: Build
      placeholder: 1
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.0
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Mac architecture (arm64 or x86_64).
      placeholder: arm64
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme
      description: The Banana Notes theme selected when the problem occurred.
      placeholder: Banana Light
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Don't paste private notes. Add only details you are comfortable sharing.
